# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
# Checks advisories, licenses, duplicate versions and source provenance.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
git-fetch-with-cli = true
ignore = [
    # rustls <= 0.21 vulnerability only applies to the client side, which this
    # workspace never uses; the SDK dependency tree has not upgraded yet.
    "RUSTSEC-2024-0336",
    # time < 0.3.35 unpadded year formats; pulled in transitively by proptest.
    "RUSTSEC-2021-0127",
    # instant is unmaintained, used by soroban dependencies upstream.
    "RUSTSEC-2024-0388",
]

[licenses]
version = 2
private = { ignore = true }
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-2-Clause-Patent",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "zlib-acknowledgement",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
