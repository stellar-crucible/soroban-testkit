[package]
name = "soroban-testkit-example-vesting-escrow"
version.workspace = true
description = "A no_std vesting escrow contract exercising every soroban-testkit crate."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
soroban-testkit-fixtures = { path = "../../crates/soroban-testkit-fixtures" }
soroban-testkit-core = { path = "../../crates/soroban-testkit-core" }
soroban-testkit-assert = { path = "../../crates/soroban-testkit-assert" }
soroban-testkit-generators = { path = "../../crates/soroban-testkit-generators", features = ["proptest"] }
proptest = { workspace = true }

[features]
default = []
testutils = ["soroban-sdk/testutils"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
