[package]
name = "soroban-testkit-example-token"
description = "ERC-20 style token contract whose test suite demonstrates every testkit crate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

publish = false

[lib]
crate-type = ["lib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-testkit-assert = { path = "../../crates/soroban-testkit-assert" }
soroban-testkit-core = { path = "../../crates/soroban-testkit-core" }
soroban-testkit-fixtures = { path = "../../crates/soroban-testkit-fixtures" }
soroban-testkit-generators = { path = "../../crates/soroban-testkit-generators" }
proptest = { workspace = true }
