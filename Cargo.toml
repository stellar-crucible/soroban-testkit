[workspace]
resolver = "2"
members = [
    "crates/soroban-testkit-core",
    "crates/soroban-testkit-assert",
    "crates/soroban-testkit-fixtures",
    "crates/soroban-testkit-fixtures-macros",
    "crates/soroban-testkit-generators",
    "examples/counter",
    "examples/domain_service",
    "examples/token",
    "examples/subscription",
    "examples/bounty_escrow",
    "examples/vesting_escrow",
    "examples/auction",
    "examples/multisig_vault",
    "examples/flash_mint",
    "examples/crowdfunding",
    "examples/liquid_staking",
    "examples/cdp",
    "examples/dynamic_amm",
    "examples/orderbook",
    "examples/nft",
    "examples/amm",
    "examples/governance",
    "crates/soroban-testkit-mock",
]
# The cargo-fuzz project needs nightly and libFuzzer; it has its own workspace.
exclude = ["crates/soroban-testkit-generators/fuzz"]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/stellar-crucible/soroban-testkit"
rust-version = "1.91"

[workspace.dependencies]
soroban-sdk = { version = "28", features = ["testutils"] }
soroban-env-host = { version = "28", features = ["testutils"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
