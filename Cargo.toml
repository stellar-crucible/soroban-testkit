[workspace]
resolver = "2"
members = [
    "crates/testkit-core",
    "crates/testkit-assert",
    "crates/testkit-fixtures",
    "crates/testkit-generators",
    "examples/counter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/stellar-crucible/soroban-testkit"
rust-version = "1.91"

[workspace.dependencies]
soroban-sdk = { version = "28", features = ["testutils"] }
soroban-env-host = { version = "28", features = ["testutils"] }
proptest = "1"
arbitrary = "1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
