name: Budget baseline

on:
  pull_request:
    paths:
      - "examples/counter/**"
      - "crates/soroban-testkit-core/src/budget.rs"
      - ".github/workflows/budget-baseline.yml"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tolerance:
        description: "Percent a measured cost may grow past the committed baseline"
        required: false
        default: "10"
      fail_on_drift:
        description: "Fail the run when a cost drifts past the tolerance"
        type: boolean
        required: false
        default: true
      record:
        description: "Rewrite the baseline on this runner and upload it instead of checking it"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  budget:
    name: Compare hot-path costs with the committed baseline
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # This job compiles the change under review, so it has to inspect it
      # first — and `needs:` cannot reach the guard job in ci.yml across a
      # workflow boundary. A pull request that only has to touch
      # `examples/counter/**` or `crates/soroban-testkit-core/src/budget.rs`
      # would otherwise get its own `build.rs` executed here while the required
      # gate was still red. Same inspector, same base-branch copy, same
      # override label.
      - name: Inspect the change before compiling it
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          path=.github/scripts/malware-guard.sh
          if git fetch --no-tags --depth=1 origin "$BASE_BRANCH" \
             && git show "FETCH_HEAD:$path" > "$RUNNER_TEMP/inspector.sh" 2>/dev/null; then
            echo "inspector taken from $BASE_BRANCH"
          else
            cp "$path" "$RUNNER_TEMP/inspector.sh"
            echo "::warning::$BASE_BRANCH has no $path yet, so this run inspects with the copy from the change under inspection."
          fi

          override=false
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != null ]; then
            if gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.labels[].name' \
               | grep -qx security-override; then
              override=true
            fi
          fi
          echo "SECURITY_OVERRIDE=$override" >> "$GITHUB_ENV"

      - name: Scan the diff
        run: bash "$RUNNER_TEMP/inspector.sh"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The metering is reproducible across machines, so the file the check
      # enforces could be recorded anywhere — but it is rewritten here, where
      # Cargo.lock and the runner are pinned, and picked up by hand.
      - name: Record the baseline on this runner
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.record == 'true'
        run: |
          set -o pipefail
          cargo test --locked -p soroban-testkit-example-counter \
            -- --ignored --nocapture budget_baseline_records_current_costs 2>&1 | tee budget.log
          {
            echo '### Recorded on this runner'
            echo ''
            echo 'Commit the file below to make it the enforced baseline.'
            echo ''
            echo '```json'
            cat examples/counter/budget.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the recorded file
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.record == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: budget-json
          path: examples/counter/budget.json

      - name: Check against the committed file
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.record != 'true'
        env:
          TESTKIT_BUDGET_TOLERANCE: ${{ github.event.inputs.tolerance || '10' }}
          FAIL_ON_DRIFT: ${{ github.event.inputs.fail_on_drift }}
        run: |
          set -o pipefail
          status=0
          cargo test --locked -p soroban-testkit-example-counter \
            -- --ignored --nocapture budget_baseline_rejects_drifted_costs 2>&1 | tee budget.log || status=$?
          {
            echo '### Budget baseline'
            echo ''
            echo "Tolerance: \`$TESTKIT_BUDGET_TOLERANCE\`%"
            echo ''
            echo '```'
            grep -E '^(BUDGET |BUDGET_SUMMARY )' budget.log || echo 'no measurements reported'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] && [ "$FAIL_ON_DRIFT" = 'false' ]; then
            echo "::warning::costs drifted past the tolerance; this run was asked not to fail"
            exit 0
          fi
          exit "$status"

      # Forks cannot write pull request comments, so a missing permission is
      # reported rather than turned into a red build on top of the drift itself.
      - name: Report the numbers on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TOLERANCE: ${{ github.event.inputs.tolerance || '10' }}
        run: |
          marker='<!-- soroban-testkit-budget-baseline -->'
          status='accepted'
          if [ ! -s budget.log ]; then
            # Covers every reason the measurement step never ran: the inspector
            # blocked the change, the toolchain failed, or the job was cancelled
            # partway. A missing table is not a pass, and this comment is looked
            # up and overwritten by the marker, so a run that goes silent would
            # leave whatever the previous run said standing on the pull request.
            body="$marker
          ## Budget baseline (not measured)

          No measurement was taken, so there is nothing to compare against the
          baseline. Either the change was blocked before it was compiled or the
          build did not reach the measurement step. This is not a pass."
          else
          numbers=$(grep -E '^(BUDGET |BUDGET_SUMMARY )' budget.log || echo 'no measurements reported')
          if grep -q '^BUDGET kind=' budget.log; then status='**rejected**'; fi
          body="$marker
          ## Budget baseline ($status)

          \`\`\`
          $numbers
          \`\`\`

          Measured on \`ubuntu-latest\` against \`examples/counter/budget.json\`, with a
          tolerance of \`$TOLERANCE\`%. Soroban metering is
          deterministic, so these readings are a property of the contract and the pinned
          SDK rather than of this machine — an SDK or env-host bump is when the baseline
          gets re-recorded, from the workflow's Record run. See the
          [budget testing guide](https://stellar-crucible.github.io/soroban-testkit/guides/budget-testing.html)."
          fi
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body"
          fi
