name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Both jobs run the copy of their script stored on the base branch, not the one
# in the pull request, and neither compiles anything from the change under
# inspection. On a pull request they enforce; on a push to main they report,
# because a change that reached main has already been through both.
jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Take the inspector from the base branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          path=.github/scripts/secret-scan.sh
          if git fetch --no-tags --depth=1 origin "$BASE_BRANCH" \
             && git show "FETCH_HEAD:$path" > "$RUNNER_TEMP/inspector.sh" 2>/dev/null; then
            echo "inspector taken from $BASE_BRANCH"
          else
            cp "$path" "$RUNNER_TEMP/inspector.sh"
            echo "::warning::$BASE_BRANCH has no $path yet, so this run inspects with the copy from the change under inspection. That only happens on the pull request that introduces it."
          fi

          # Read through the API rather than the event payload: a re-run replays
          # the payload from the original trigger, so a label applied afterwards
          # would not be in it and the escape hatch would only work once.
          override=false
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != null ]; then
            if gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.labels[].name' \
               | grep -qx security-override; then
              override=true
            fi
          fi
          echo "SECURITY_OVERRIDE=$override" >> "$GITHUB_ENV"

      - name: Scan the added lines for credentials
        run: bash "$RUNNER_TEMP/inspector.sh"

  pipeline:
    name: CI integrity
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Take the auditor from the base branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          path=.github/scripts/ci-integrity.sh
          if git fetch --no-tags --depth=1 origin "$BASE_BRANCH" \
             && git show "FETCH_HEAD:$path" > "$RUNNER_TEMP/auditor.sh" 2>/dev/null; then
            echo "auditor taken from $BASE_BRANCH"
          else
            cp "$path" "$RUNNER_TEMP/auditor.sh"
            echo "::warning::$BASE_BRANCH has no $path yet, so this run audits with the copy from the change under inspection. That only happens on the pull request that introduces it."
          fi

          override=false
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != null ]; then
            if gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.labels[].name' \
               | grep -qx security-override; then
              override=true
            fi
          fi
          echo "SECURITY_OVERRIDE=$override" >> "$GITHUB_ENV"

      - name: Audit the workflow files
        run: bash "$RUNNER_TEMP/auditor.sh"
