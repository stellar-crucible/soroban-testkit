[package]
name = "soroban-testkit-generators"
description = "Soroban-aware property testing generators for proptest"
keywords = ["soroban", "stellar", "testing", "proptest", "property-testing"]
categories = ["development-tools::testing"]
homepage = "https://stellar-crucible.github.io/soroban-testkit/"
readme = "README.md"
documentation = "https://stellar-crucible.github.io/soroban-testkit/crates/generators.html"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
soroban-sdk = { workspace = true }
soroban-env-host = { workspace = true, optional = true }
soroban-testkit-core = { path = "../soroban-testkit-core", version = "0.4.1", optional = true }
proptest = { workspace = true, optional = true }
ed25519-dalek = { version = "2.2.0", default-features = false, optional = true }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "arithmetic"], optional = true }
sha2 = { version = "0.10.9", default-features = false, optional = true }

[features]
default = ["proptest"]
proptest = ["dep:proptest", "dep:ed25519-dalek", "dep:k256", "dep:sha2", "dep:soroban-testkit-core", "dep:soroban-env-host"]
