[package]
name = "testkit-generators"
description = "Soroban-aware property testing generators for proptest and arbitrary"
keywords = ["soroban", "stellar", "testing", "proptest", "property-testing"]
categories = ["development-tools::testing"]
documentation = "https://stellar-crucible.github.io/soroban-testkit/crates/generators.html"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
soroban-sdk = { workspace = true }
proptest = { workspace = true, optional = true }
arbitrary = { workspace = true, optional = true }

[features]
default = ["proptest"]
proptest = ["dep:proptest"]
arbitrary = ["dep:arbitrary"]
