[package]
name = "soroban-testkit-fixtures"
description = "Reusable test fixture and setup framework for Soroban contracts"
keywords = ["soroban", "stellar", "testing", "fixtures", "smart-contracts"]
categories = ["development-tools::testing"]
homepage = "https://stellar-crucible.github.io/soroban-testkit/"
readme = "README.md"
documentation = "https://stellar-crucible.github.io/soroban-testkit/crates/fixtures.html"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
soroban-sdk = { workspace = true }
soroban-env-host = { workspace = true }
soroban-testkit-core = { path = "../soroban-testkit-core", version = "0.4.1" }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["rand_core"] }
rand_core = { version = "0.6.4", default-features = false, features = ["getrandom"] }

